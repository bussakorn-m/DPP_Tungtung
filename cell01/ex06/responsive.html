<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsive Table</title>
    <style>
      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
      }

      .responsive-table {
        width: 100%;
        height: 100vh;
        border-collapse: collapse;
        table-layout: fixed;
      }

      .responsive-table td {
        width: 50%;
        height: 100vh;
        padding: 1rem;
        text-align: center;
        vertical-align: middle;
      }

      .cell1 {
        background-color: pink;
      }

      .cell2 {
        background-color: violet;
      }

      @media (max-width: 600px) {
        .responsive-table,
        .responsive-table tbody,
        .responsive-table tr,
        .responsive-table td {
          display: block;
          width: 100%;
        }

        .responsive-table td {
          min-height: 50vh;
          height: auto;
        }
      }
    </style>
  </head>
  <body>
    <table class="responsive-table" border="0" cellspacing="0" cellpadding="0">
      <tr>
        <td class="cell1">Cell 1</td>
        <td class="cell2">Cell 2</td>
      </tr>
    </table>
  </body>
</html>
