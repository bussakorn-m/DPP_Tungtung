<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            font-family: Arial, sans-serif;
        }

        .box1, .box2 {
            display: inline-block;
            width: 200px;
            height: 150px;
            margin: 0;
            text-align: center;
            line-height: 150px;
            border: 1px solid black;
        }

        .box1 {
            background-color: pink;
            color: black;
        }
        
        .box2 {
            background-color: violet;
            color: black;
        }
    </style>
</head>
<body>
    <div class="box1">Tung Tung Tung Sahur</div>
    <div class="box2">ballerina cappuccina</div>
</body>
</html>
